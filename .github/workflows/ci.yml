name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux-real-kernel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check version and tag
        shell: bash
        run: |
          test "$(cat VERSION)" = "0.1.0"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$(cat VERSION)"; fi
      - name: Run real Linux Landlock comparison
        run: python3 scripts/run_native_linux.py --build-root "$RUNNER_TEMP/Build"
      - name: Package tracked source
        run: python3 scripts/package_source.py --build-root "$RUNNER_TEMP/Build"
      - name: Rebuild unpacked package and rerun kernel comparison
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Build/解包"
          tar -xzf "$RUNNER_TEMP/Build/发行/LandlockFilesystemGate-0.1.0.tar.gz" -C "$RUNNER_TEMP/Build/解包"
          python3 "$RUNNER_TEMP/Build/解包/LandlockFilesystemGate-0.1.0/scripts/run_native_linux.py" --build-root "$RUNNER_TEMP/Build/解包验证"
      - name: Upload source and machine receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LandlockFilesystemGate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Build/发行/*
            ${{ runner.temp }}/Build/LandlockFilesystemGate-native/receipt.json
            ${{ runner.temp }}/Build/解包验证/LandlockFilesystemGate-native/receipt.json
